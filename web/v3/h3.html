<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⑧ H3 视频 · v3</title>
<link rel="stylesheet" href="./v3.css">
<link rel="stylesheet" href="./h3.css">
</head>
<body>
<div class="wrap">
  <div class="h2row pt">
    <h1 class="h2">⑧ H3 · 批生视频</h1>
    <span class="sub" id="sub">加载中…</span>
    <span id="counts"></span>
  </div>
  <div class="railwrap"><div class="rail" id="rail"></div></div>

  <div class="bar"><b>一卡一镜</b>
    <span class="note">approved 图 → I2V (~102s/10s镜, GPU 独占) · 运镜句随镜注入 · 败镜换 seed 重掷 · 镜间可⛔</span>
  </div>

  <div id="grid" class="hgrid"></div>

  <div class="savebar">
    <span class="note" id="stat">—</span>
    <span class="flex1"></span>
    <a class="ghost" id="btn-v2" href="#" target="_blank" title="v2 工坊 (装配剪映草稿在那边)">v2 工坊 (装配) ↗</a>
    <button class="ghost" id="btn-retry" title="连败镜一起重试 (换 h3_seed)">⚡ 重试败镜</button>
    <button class="go" id="btn-run">🎬 H3 批生视频</button>
  </div>
</div>
<script src="/web/lightbox.js"></script>
<script type="module" src="./h3.js"></script>
</body>
</html>
