<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⑧ H3 视频 · v3</title>
<link rel="stylesheet" href="./v3.css">
<link rel="stylesheet" href="./h3.css">
</head>
<body>
<div class="wrap">
  <div class="h2row pt">
    <h1 class="h2">⑧ H3 · 批生视频</h1>
    <span class="sub" id="sub">加载中…</span>
    <span id="counts"></span>
  </div>
  <div class="railwrap"><div class="rail" id="rail"></div></div>

  <div class="bar"><b>一卡一镜</b>
    <span class="note">approved 图 → I2V (~102s/10s镜, GPU 独占) · 运镜句随镜注入 · 败镜换 seed 重掷 · 镜间可⛔</span>
  </div>

  <div id="grid" class="hgrid"></div>

  <!-- 1106 用户令: 对齐 v2 购物篮 — 勾选卡片浮现, ♻️列队重做=重设计→生图→生视频全链 -->
  <div class="cartbar" id="cart" hidden>
    <b class="cart-n">🧺 已选 <span id="cart-count">0</span> 镜</b>
    <button class="go" id="btn-redo" title="LLM重设计画面句 → 重译英文 → 重生图(换seed) → 生视频 全自动 (~5min/镜)">♻️ 列队重做</button>
    <button class="ghost" id="btn-cart-clear">清空</button>
    <span class="note">~5min/镜 · 镜间可⛔停止</span>
  </div>

  <div class="savebar">
    <span class="note" id="stat">—</span>
    <span class="flex1"></span>
    <button class="go" id="btn-draft" title="装配剪映草稿 (pyJianYingDraft: 视频轨+字幕+口播+品牌卡; 产物在剪映草稿目录)">🎞 装配剪映草稿</button>
    <a class="ghost" id="btn-v2" href="#" target="_blank" title="v2 工坊 (备用操作面)">v2 工坊 ↗</a>
    <button class="ghost" id="btn-retry" title="连败镜一起重试 (换 h3_seed)">⚡ 重试败镜</button>
    <button class="go" id="btn-approve" title="本页所有图出镜一键 approved (先点图过目) — H3 批只吃 approved">✅ 全部过审</button>
    <button class="go" id="btn-run">🎬 H3 批生视频</button>
  </div>
</div>
<script src="/web/lightbox.js"></script>
<script type="module" src="./h3.js"></script>
</body>
</html>
