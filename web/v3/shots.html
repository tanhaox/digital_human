<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>③ 分镜文字 · v3</title>
<link rel="stylesheet" href="./v3.css">
<link rel="stylesheet" href="./shots.css">
</head>
<body>
<div class="wrap">
  <div class="h2row pt">
    <h1 class="h2">③ 分镜 · 文字总审</h1>
    <span class="sub" id="sub">加载中…</span>
    <span id="counts"></span>
  </div>
  <div class="railwrap"><div class="rail" id="rail"></div></div>
  <div id="axis" class="mini"></div>

  <div class="layout">
    <main>
      <div id="syswarn"></div>
      <div id="blocks"></div>
    </main>

    <aside class="side">
      <div class="card" id="gatecard"></div>
      <div class="card">
        <div class="ctitle">镜级问题 <span id="qcount" class="badge bad">0</span></div>
        <div class="qnote">点一条 → 跳到该镜</div>
        <div id="qlist"></div>
      </div>
      <details class="card" id="arcbox">
        <summary>弧级提醒 <span id="acount" class="badge warn">0</span></summary>
        <div id="alist"></div>
      </details>
      <div class="card" id="warncard"></div>
      <details class="card">
        <summary>规格 (这一页做什么)</summary>
        <ol class="specs">
          <li>弧内句按字数估时装包成镜 (3–7.5s), 镜号 s1..sN 全局连续。</li>
          <li>每镜一句画面句 = 动画起点帧 (80–200 字, 禁终态, 禁文字载体)。</li>
          <li>大字卡挂在句上: ①卡指令 + 分诊采纳, 可挂在任意一句之后。</li>
          <li>质检 = 文字层可判项 (载体/过短/终态/引号), 运镜/景别归 ④。</li>
          <li>零 GPU: 这一页改字不花钱, 过了闸后面的每一步都在烧钱。</li>
        </ol>
      </details>
    </aside>
  </div>

  <div class="savebar">
    <span class="note" id="dirty">改稿 0 处未保存</span>
    <span class="flex1"></span>
    <button class="ghost" id="btn-run">🎨 重跑分镜</button>
    <button class="go" id="btn-save"><span id="save-label">💾 保存分镜</span><span id="n-dirty"> (0)</span></button>
    <button class="go" id="btn-next" disabled title="分镜闸未开">④ 导演 →</button>
  </div>
</div>
<script type="module" src="./shots.js"></script>
</body>
</html>
