<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>① 文稿分诊 · v3</title>
<link rel="stylesheet" href="./v3.css">
</head>
<body>
<div class="wrap">
  <div class="h2row pt">
    <h1 class="h2">① 文稿 · 分诊体检</h1>
    <span class="sub" id="sub">加载中…</span>
    <span id="counts"></span>
  </div>
  <div class="railwrap"><div class="rail" id="rail"></div></div>
  <div id="axis" class="mini"></div>

  <div class="bar"><b>📄 一句一行 · 点行即改</b>
    <span class="note">🟡🔴 标注长在行上 · 语态点签可改 · 改完底部保存</span></div>
  <div id="doclist"></div>
  <div class="savebar">
    <span class="note" id="dirty">改稿 0 处未保存</span>
    <span class="flex1"></span>
    <button class="ghost" id="btn-run">🩺 重新分诊</button>
    <button class="go" id="btn-save">💾 保存修改 (<span id="n-dirty">0</span>)</button>
  </div>
  <div class="gatebar" id="gate"></div>
  <div class="panel specs"><b>规格</b>
    <ol>
      <li>逐行三去向: 语态行→②弧分配 / 合法结构指令【卡:】【图:】路由不进口播 / 无法分类→🔴拦截人工分诊。</li>
      <li>确定性闸=执法 (伪指令/时间铁律2020线/长句歧义/清单排比), LLM=语态标注+创作建议 (金句/配图/书证/事件), LLM 失败退确定性层。</li>
      <li>全部 🔴 处置完 → 分诊闸自动开 → ②立意解锁; 改稿留痕于 v3.lines。</li>
    </ol>
  </div>
</div>
<link rel="stylesheet" href="./triage.css">
<script type="module" src="./triage.js"></script>
</body>
</html>
