<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⑥ K2 生图 · v3</title>
<link rel="stylesheet" href="./v3.css">
<link rel="stylesheet" href="./k2.css">
</head>
<body>
<div class="wrap">
  <div class="h2row pt">
    <h1 class="h2">⑥ K2 · 批生图人检</h1>
    <span class="sub" id="sub">加载中…</span>
    <span id="counts"></span>
  </div>
  <div class="railwrap"><div class="rail" id="rail"></div></div>

  <div class="bar">
    <b>一卡一镜</b>
    <span class="note">图出后过审 (✅) 才可进 ⑦ 盖章 · 文字嫌疑镜 (OCR 检字命中) 红标 · 单镜 🔁 换 seed 重掷</span>
  </div>

  <div id="grid" class="kgrid"></div>

  <div class="cartbar" id="cart" hidden>
    <b class="cart-n">🧺 已选 <span id="cart-count">0</span> 镜</b>
    <button class="go" id="btn-redo-img" title="LLM重设计画面句 → 重译英文 → 生图后停在人检 (视频归 ⑧ 页)">🎨 重做到生图</button>
    <button class="ghost" id="btn-cart-clear">清空</button>
    <span class="note">~3.5min/镜 · 镜间可⛔停止</span>
  </div>

  <div class="savebar">
    <span class="note" id="stat">—</span>
    <span class="flex1"></span>
    <button class="go" id="btn-all">✅ 全部过审</button>
    <button class="ghost" id="btn-run">🎨 K2 批生图</button>
  </div>
</div>
<script type="module" src="./k2.js"></script>
</body>
</html>
