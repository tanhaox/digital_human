workflows:
  - name: character_three_view
    source: character_three_view.json
    runtime_path: E:/AI/ComfyUI_windows_portable/ComfyUI/user/default/workflows/character_three_view.json
    auto_sync: true
    last_verified: 2026-07-26 (krea2 type)
    description: 角色多视图定型(正脸/侧脸/全身) — 基于"数字人多维度定型图生成器"
    api_prompt_endpoint: /prompt
    api_history_endpoint: /history/{prompt_id}
    output_count: 3
    output_view_order: [front, side, full]

