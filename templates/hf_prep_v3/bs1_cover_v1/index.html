<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- bs1_cover_v1 — 老谭拆书·深空蓝金 封面页 (2026-09-07, 风格源 .tmp/style_gallery_laotan_book.html №1)
  内容: ep_tag(EP 01·导读) / title(集题) / book(拆《书名》) / brand_tag(品牌句)
  协议: HyperFrames — #root data-* + GSAP paused timeline, 入场 ≤2s + 保持。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{--navy-1:#0C1626;--navy-2:#10233D;--navy-3:#0C1B31;--gold:#C9A25E;--gold-2:#E3C689;--paper:#EDEAE0;--sub:#9AA6B5}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{font-family:"Noto Serif SC",serif;color:var(--paper)}
  #root{position:relative;width:1920px;height:1080px;overflow:hidden;
        background:linear-gradient(135deg,var(--navy-1) 0%,var(--navy-2) 60%,var(--navy-3) 100%)}
  .bg{position:absolute;inset:0;display:none}
  .bg .ph{width:100%;height:100%;object-fit:cover;display:block}
  .bg .veil{position:absolute;inset:0;
        background:linear-gradient(100deg,rgba(12,22,38,.94) 0%,rgba(12,22,38,.86) 45%,rgba(16,35,61,.72) 100%)}

  .glow{position:absolute;width:1100px;height:700px;right:-260px;top:-220px;border-radius:50%;
        background:radial-gradient(closest-side,rgba(201,162,94,.13),transparent 70%);pointer-events:none}
  .caps{font-family:Manrope,sans-serif;font-weight:700;letter-spacing:.42em;text-transform:uppercase}
  .ep{position:absolute;top:118px;left:150px;font-family:Manrope,sans-serif;font-weight:700;
      font-size:30px;letter-spacing:.35em;color:var(--gold)}
  .rule{position:absolute;top:186px;left:150px;width:120px;height:4px;background:var(--gold)}
  h1{position:absolute;top:246px;left:150px;right:150px;font-weight:900;font-size:104px;
     line-height:1.28;color:#F5EFE2;letter-spacing:.01em}
  .book{position:absolute;top:600px;left:150px;font-size:40px;font-weight:700;color:var(--sub)}
  .book em{font-style:normal;color:var(--gold-2)}
  .brand{position:absolute;top:112px;right:150px;left:auto;font-size:24px;color:#77808F;letter-spacing:.18em;text-align:right}
  .logo{position:absolute;bottom:216px;right:150px;height:110px;width:auto}
</style>
</head>
<body>
<div id="root"
     data-composition-id="bs1_cover_v1" data-start="0" data-duration="{{duration_sec}}"
     data-width="1920" data-height="1080"
     data-ep="{{ep_tag}}" data-title="{{title}}" data-book="{{book}}"
     data-brand="{{brand_tag}}" data-logo="{{logo_b64}}" data-img="{{img}}">
  <div class="bg" id="bg"><img class="ph" id="ph" alt=""><div class="veil"></div></div>
  <div class="glow"></div>
  <div class="ep caps" id="ep"></div>
  <div class="rule" id="rule"></div>
  <h1 id="title"></h1>
  <div class="book" id="book"></div>
  <div class="brand" id="brand"></div>
  <img class="logo" id="logo" alt="">
</div>
<script>
// 预览自适应 (0907): 小容器 (风格页 iframe) 自动缩放到视口; 生产 1920 渲染不触发
(function () {
  var w = window.innerWidth, h = window.innerHeight;
  if (w >= 1900) return;
  var s = Math.min(w / 1920, h / 1080);
  var r = document.getElementById("root");
  if (!r) return;
  r.style.transform = "scale(" + s + ")";
  r.style.transformOrigin = "top left";
  try { document.body.style.background = getComputedStyle(r).background; } catch (e) {}
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var root = document.getElementById("root");
  var DUR = parseFloat(root.getAttribute("data-duration")) || 5;
  var put = function (id, attr, fn) {
    var v = root.getAttribute(attr) || "";
    var el = document.getElementById(id);
    if (el) el.innerHTML = fn ? fn(v) : v.replace(/</g, "&lt;");
  };
  put("ep", "data-ep");
  put("title", "data-title");
  put("book", "data-book", function (v) { return v.replace(/《[^》]*》/g, "<em>《$&》</em>").replace(/《|》/g, ""); });
  put("brand", "data-brand");
  var img = root.getAttribute("data-img") || "";
  if (img) { document.getElementById("ph").src = img; document.getElementById("bg").style.display = "block"; }
  var logo = root.getAttribute("data-logo") || "";
  if (logo) document.getElementById("logo").src = logo;
  // 长题自适应: >14 字降号
  var t = document.getElementById("title");
  var n = (root.getAttribute("data-title") || "").replace(/\s/g, "").length;
  if (n > 14) t.style.fontSize = "84px";
  if (n > 20) t.style.fontSize = "70px";
  var tl = gsap.timeline({paused: true});
  tl.from("#ep", {x: -40, autoAlpha: 0, duration: .6, ease: "power3.out"}, .1)
    .from("#rule", {scaleX: 0, transformOrigin: "left center", duration: .5, ease: "power2.out"}, .3)
    .from("#title", {y: 46, autoAlpha: 0, duration: .8, ease: "power3.out"}, .45)
    .from("#book", {y: 24, autoAlpha: 0, duration: .6, ease: "power2.out"}, .75)
    .from("#bg, #brand, #logo", {autoAlpha: 0, duration: .5}, .95)
    .to({}, {duration: Math.max(0.2, DUR - 1.6)});
  window.__timelines = window.__timelines || {};
  window.__timelines["bs1_cover_v1"] = tl;
  window.addEventListener("message", function (ev) {
    if (ev.data && ev.data.type === "preview-play") { tl.restart(); }
  });
})();
</script>
</body>
</html>
