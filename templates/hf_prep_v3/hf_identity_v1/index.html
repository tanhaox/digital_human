<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- ============================================================
  hf_identity_v1 — 编辑纸墨风身份卡 (2026-09-05, 版式源杂志风预览页面 06 身份句)
  内容: identity_body(自报家门一句话, 保留标点) + hot_word(锈红 em) +
        About 栏 + 品牌印章 (brand_name 五字入 2×3 印面)。
  字号阶梯与断行同 hf_quote_v2 (标点计入字数: ≤8字 150px/1行 ·
  9~16字 110px/2行 · >16字 92px/3~4行; 按标点语义断行)。
  财经线 (tech) 专用 — 地缘线另做一套 (2026-09-05 用户裁决)。
  协议: HyperFrames — #root data-* + GSAP paused timeline 注册
        window.__timelines, 入场 ≤2s + 尾部保持段。
  ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2EEE6; --paper-2:#EAE4D8; --ink:#1C1613; --ink-soft:#3B2424;
    --taupe:#A1836E; --rust:#9E4A2F; --hair:rgba(28,22,19,.28);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper-2)}
  body{font-family:"Noto Serif SC",serif;color:var(--ink)}
  #root{position:relative;width:1920px;height:1080px;background:var(--paper-2);overflow:hidden}
  .grain{position:absolute;inset:0;opacity:.5;pointer-events:none;
    background-image:radial-gradient(rgba(28,22,19,.06) 1px,transparent 1px);background-size:5px 5px}
  .rule{height:1px;background:var(--hair);transform-origin:left}
  .caps{font-family:Manrope,sans-serif;font-weight:700;letter-spacing:.34em;text-transform:uppercase}

  .frame{position:absolute;inset:0;padding:110px 130px;display:flex;flex-direction:column}
  .quote-wrap{flex:1;display:flex;align-items:center;justify-content:center}
  blockquote{font-size:150px;font-weight:900;line-height:1.4;text-align:center}
  blockquote em{font-style:normal;color:var(--rust)}
  blockquote.mid{font-size:110px;line-height:1.5}
  blockquote.long{font-size:92px;line-height:1.66}
  .sig{display:flex;justify-content:space-between;align-items:flex-end}
  .sig .caps{font-size:26px;color:var(--ink-soft)}
  .stamp{
    width:240px;height:240px;background:var(--rust);color:#F6F1E7;position:relative;
    display:grid;grid-template-columns:repeat(2,72px);grid-template-rows:repeat(3,74px);
    place-content:center;place-items:center;
    font-size:64px;font-weight:900;line-height:1;letter-spacing:0;
    border-radius:14px 8px 12px 9px;  /* 手工凿边的不规则圆角 */
  }
  .stamp::before{ /* 印框 */
    content:"";position:absolute;inset:10px;border:3px solid rgba(246,241,231,.92);
    border-radius:8px 4px 7px 5px;pointer-events:none;
  }
</style>
</head>
<body>
<div id="root"
     data-composition-id="hf_identity_v1"
     data-start="0"
     data-duration="{{duration_sec}}"
     data-width="1920"
     data-height="1080"
     data-identity="{{identity_body}}"
     data-hot="{{hot_word}}"
     data-brand="{{brand_name}}">
  <div class="grain"></div>
  <div class="frame">
    <div class="rule" id="top-rule"></div>
    <div class="quote-wrap"><blockquote id="identity"></blockquote></div>
    <div class="sig">
      <span class="caps">About</span>
      <div class="stamp" id="stamp"></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var root = document.getElementById("root");
  var DUR = parseFloat(root.getAttribute("data-duration")) || 6;
  var quote = root.getAttribute("data-identity") || "";
  var hot = root.getAttribute("data-hot") || "";
  var brand = root.getAttribute("data-brand") || "老谭科技观";

  // ── 字号阶梯 + 语义断行 (同 hf_quote_v2) ──
  var q = document.getElementById("identity");
  var count = quote.replace(/\s/g, "").length;
  var bracket = count <= 8 ? 1 : count <= 16 ? 2 : count <= 28 ? 3 : 4;
  var lines;
  var segs = quote.match(/[^，。、；：,.;:!?！？]+[，。、；：,.;:!?！？]?/g) || [quote];
  if (segs.length >= bracket) {
    var target = Math.ceil(count / bracket);
    lines = [];
    var cur = "";
    for (var i = 0; i < segs.length; i++) {
      if (cur && (cur.replace(/\s/g, "").length + segs[i].replace(/\s/g, "").length) > target
          && lines.length < bracket - 1) {
        lines.push(cur);
        cur = segs[i];
      } else {
        cur += segs[i];
      }
    }
    if (cur) lines.push(cur);
  } else {
    lines = [quote];
  }
  q.classList.add(bracket === 1 ? "" : bracket === 2 ? "mid" : "long");
  // 行内构建: hot_word → <em> (textContent 安全, 不走 innerHTML)
  lines.forEach(function (line, idx) {
    if (idx > 0) q.appendChild(document.createElement("br"));
    if (hot && line.indexOf(hot) >= 0 && hot !== line) {
      var parts = line.split(hot);
      for (var p = 0; p < parts.length; p++) {
        if (parts[p]) q.appendChild(document.createTextNode(parts[p]));
        if (p < parts.length - 1) {
          var em = document.createElement("em");
          em.textContent = hot;
          q.appendChild(em);
        }
      }
    } else {
      q.appendChild(document.createTextNode(line));
    }
  });

  // ── 品牌印章: 五字入 2×3 印面 ──
  var stamp = document.getElementById("stamp");
  brand.replace(/\s/g, "").slice(0, 6).split("").forEach(function (ch) {
    var s = document.createElement("span");
    s.textContent = ch;
    stamp.appendChild(s);
  });

  var tl = gsap.timeline({ paused: true });
  tl.from(q, { opacity: 0, y: 64, duration: 1, ease: "power3.out" }, .2)
    .from(document.getElementById("top-rule"), { scaleX: 0, duration: 1,
      ease: "power3.out" }, .7)
    .from(stamp, { opacity: 0, scale: 1.5, rotate: -8, duration: .7,
      ease: "back.out(2)" }, 1.0)
    .from(document.querySelector(".sig .caps"), { opacity: 0, duration: .5 }, 1.3);

  // HyperFrames 协议: paused timeline 注册到 __timelines + 尾部保持段
  window.__timelines = window.__timelines || {};
  window.__timelines["hf_identity_v1"] = tl;
  tl.to({}, { duration: Math.max(0.5, DUR - 2.0) }, 2.0);
})();
</script>
</body>
</html>
