<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- ============================================================
  hf_bookquote_v1 — 拆书线书摘金句卡 B-Q1 (2026-09-05, 版式源 .tmp/style_book_card.html)
  内容层: book_title(书名·右上) + 三句书摘 (q1/q2/q3, 01/02/03 编号;
          k1/k2/k3 = 各句锈红关键短语, 须为该句子串, 缺省不高亮)
  固定件: 刊头「{brand} · 书摘」/ 品牌尾注 / logo PNG (logo_b64)
  底纸 paper-2 (比书籍卡深一度, 同财经 05 卡层次)。
  规则 (用户令 2026-09-05): 每集 3 句 × 6 集全书不重复; 句长 ≥12 字。
  协议: HyperFrames — #root data-* + GSAP paused timeline 注册
        window.__timelines, 入场 ≤2s + 尾部保持段。
  ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2EEE6; --paper-2:#EAE4D8; --ink:#1C1613; --ink-soft:#3B2424;
    --taupe:#A1836E; --rust:#9E4A2F; --hair:rgba(28,22,19,.28);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper-2)}
  body{font-family:"Noto Serif SC",serif;color:var(--ink)}
  #root{position:relative;width:1920px;height:1080px;background:var(--paper-2);overflow:hidden}
  .grain{position:absolute;inset:0;opacity:.5;pointer-events:none;
    background-image:radial-gradient(rgba(28,22,19,.06) 1px,transparent 1px);background-size:5px 5px}
  .caps{font-family:Manrope,sans-serif;font-weight:700;letter-spacing:.34em;text-transform:uppercase}

  .wrap{position:absolute;inset:0;padding:100px 130px 88px;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:baseline}
  .mast{font-family:"Noto Serif SC",serif;font-weight:900;font-size:40px;
        letter-spacing:.3em;color:var(--ink)}
  .from{font-family:"Noto Serif SC",serif;font-weight:700;font-size:28px;
        letter-spacing:.14em;color:var(--taupe)}
  .quotes{flex:1;display:flex;flex-direction:column;justify-content:center;gap:64px;max-width:1560px}
  blockquote{display:flex;gap:36px;align-items:flex-start}
  blockquote .qm{font-family:Manrope,sans-serif;font-weight:700;font-size:32px;
                 letter-spacing:.2em;color:var(--taupe);flex:none;transform:translateY(14px)}
  blockquote p{font-size:48px;font-weight:900;line-height:1.62}
  blockquote p em{font-style:normal;color:var(--rust)}
  .tail{font-size:26px;color:var(--ink-soft);display:flex;
        justify-content:space-between;align-items:center}
  .tail img{height:120px;width:auto;display:block}
</style>
</head>
<body>
<div id="root"
     data-composition-id="hf_bookquote_v1"
     data-start="0"
     data-duration="{{duration_sec}}"
     data-width="1920"
     data-height="1080"
     data-book-title="{{book_title}}"
     data-q1="{{q1}}" data-k1="{{k1}}"
     data-q2="{{q2}}" data-k2="{{k2}}"
     data-q3="{{q3}}" data-k3="{{k3}}"
     data-brand="{{brand_name}}"
     data-logo="{{logo_b64}}">
  <div class="grain"></div>
  <div class="wrap">
    <div class="top"><span class="mast" id="mast"></span><span class="from" id="from"></span></div>
    <div class="quotes">
      <blockquote id="q-1"><span class="qm">01</span><p></p></blockquote>
      <blockquote id="q-2"><span class="qm">02</span><p></p></blockquote>
      <blockquote id="q-3"><span class="qm">03</span><p></p></blockquote>
    </div>
    <div class="tail" id="tail"><span id="brand-line"></span><img id="logo" alt=""></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var root = document.getElementById("root");
  var DUR = parseFloat(root.getAttribute("data-duration")) || 5;
  var brand = root.getAttribute("data-brand") || "静读书";
  var bookTitle = root.getAttribute("data-book-title") || "";
  var logo = root.getAttribute("data-logo") || "";

  document.getElementById("mast").textContent = brand + " · 书摘";
  var from = document.getElementById("from");
  from.textContent = bookTitle;
  if (bookTitle.replace(/\s/g, "").length > 18) from.style.fontSize = "24px";

  // ── 三句书摘: qN 前/中/后三段 textContent 拼装, kN 为子串才锈红 (防注入) ──
  for (var i = 1; i <= 3; i++) {
    var q = root.getAttribute("data-q" + i) || "";
    var k = root.getAttribute("data-k" + i) || "";
    var p = document.querySelector("#q-" + i + " p");
    var hide = !q.trim();
    if (hide) { document.getElementById("q-" + i).style.display = "none"; continue; }
    var at = k && q.indexOf(k);
    if (k && at > -1) {
      p.appendChild(document.createTextNode(q.slice(0, at)));
      var em = document.createElement("em"); em.textContent = k; p.appendChild(em);
      p.appendChild(document.createTextNode(q.slice(at + k.length)));
    } else {
      p.textContent = q;
    }
  }

  document.getElementById("brand-line").textContent = brand + " · 读透一本好书";
  if (logo) document.getElementById("logo").src = logo;

  var tl = gsap.timeline({ paused: true });
  tl.from(document.getElementById("mast"), { opacity: 0, y: 40, duration: .8, ease: "power3.out" }, .15)
    .from(from, { opacity: 0, x: 90, duration: .8, ease: "power3.out" }, .32)
    .from("#q-1", { opacity: 0, y: 64, duration: .9, ease: "power3.out" }, .4)
    .from("#q-2", { opacity: 0, y: 64, duration: .9, ease: "power3.out" }, .6)
    .from("#q-3", { opacity: 0, y: 64, duration: .9, ease: "power3.out" }, .8)
    .from("#tail", { opacity: 0, duration: .5 }, 1.3);

  // HyperFrames 协议: paused timeline 注册 + 尾部保持段
  window.__timelines = window.__timelines || {};
  window.__timelines["hf_bookquote_v1"] = tl;
  tl.to({}, { duration: Math.max(0.5, DUR - 2.0) }, 2.0);
})();
</script>
</body>
</html>
