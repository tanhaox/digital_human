<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- bs1_list_v1 — 老谭拆书·深空蓝金 清单页: 眉标+页题+2~4 条要点(+可选金句条)(+可选右图 Pexels)
  data-items: "01 卖时间随时可换|||02 靠不可替代定价" ; data-img: 图(base64/URL, 空则纯排版) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{--navy-1:#0C1626;--navy-2:#10233D;--gold:#C9A25E;--paper:#EDEAE0;--sub:#9AA6B5}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{font-family:"Noto Serif SC",serif;color:var(--paper)}
  #root{position:relative;width:1920px;height:1080px;overflow:hidden;
        background:linear-gradient(135deg,var(--navy-1) 0%,var(--navy-2) 100%)}
  .imgcard{position:absolute;top:200px;right:150px;width:620px;height:620px;display:none;
        border-radius:10px;overflow:hidden;border:1px solid rgba(201,162,94,.4);
        box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .imgcard .ph{width:100%;height:100%;object-fit:cover;display:block}
  .imgcard .veil{position:absolute;inset:0;pointer-events:none;
        background:linear-gradient(160deg,rgba(12,22,38,.42) 0%,rgba(12,22,38,.18) 45%,rgba(16,35,61,.38) 100%)}
  .imgcard .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 26px;
        background:linear-gradient(transparent,rgba(12,22,38,.85));font-size:22px;
        color:#D8D2C4;font-weight:700;letter-spacing:.06em}
  .caps{font-family:Manrope,sans-serif;font-weight:700;letter-spacing:.42em;text-transform:uppercase}
  .kicker{position:absolute;top:104px;left:150px;font-size:24px;color:var(--gold);letter-spacing:.4em}
  h1{position:absolute;top:158px;left:150px;font-weight:900;font-size:72px;color:#F5EFE2;line-height:1.3}
  .list{position:absolute;top:330px;left:150px;width:560px;bottom:360px;display:flex;flex-direction:column;justify-content:flex-start}
  .item{display:flex;align-items:baseline;gap:36px;padding:24px 0}
  .no{font-family:Manrope,sans-serif;font-weight:800;font-size:44px;color:var(--gold);flex:none;width:96px}
  .txt{font-size:38px;font-weight:700;line-height:1.55;color:var(--paper)}
  .quote{position:absolute;left:150px;bottom:214px;background:var(--gold);color:#141B2A;
         font-weight:900;font-size:40px;padding:22px 46px;letter-spacing:.1em}
  .foot{position:absolute;top:112px;right:150px;left:auto;font-size:22px;color:#77808F;letter-spacing:.18em;text-align:right}
  .has-img .list{width:880px}
  
  .has-img .quote{font-size:32px;padding:16px 34px}
</style>
</head>
<body>
<div id="root"
     data-composition-id="bs1_list_v1" data-start="0" data-duration="{{duration_sec}}"
     data-width="1920" data-height="1080"
     data-kicker="{{kicker}}" data-title="{{title}}" data-items="{{items}}"
     data-quote="{{quote}}" data-foot="{{foot}}" data-img="{{img}}" data-img-cap="{{img_cap}}">
  <div class="imgcard" id="imgcard"><img class="ph" id="ph" alt=""><div class="veil"></div><div class="cap" id="cap"></div></div>
  <div class="kicker caps" id="kicker"></div>
  <h1 id="title"></h1>
  <div class="list" id="list"></div>
  <div class="quote" id="quote"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
// 预览自适应 (0907): 小容器 (风格页 iframe) 自动缩放到视口; 生产 1920 渲染不触发
(function () {
  var w = window.innerWidth, h = window.innerHeight;
  if (w >= 1900) return;
  var s = Math.min(w / 1920, h / 1080);
  var r = document.getElementById("root");
  if (!r) return;
  r.style.transform = "scale(" + s + ")";
  r.style.transformOrigin = "top left";
  try { document.body.style.background = getComputedStyle(r).background; } catch (e) {}
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var root = document.getElementById("root");
  var DUR = parseFloat(root.getAttribute("data-duration")) || 5;
  var img = root.getAttribute("data-img") || "";
  if (img) {
    document.getElementById("ph").src = img;
    document.getElementById("imgcard").style.display = "block";
    document.getElementById("cap").textContent = root.getAttribute("data-img-cap") || "";
    root.classList.add("has-img");
  }
  document.getElementById("kicker").textContent = root.getAttribute("data-kicker") || "";
  document.getElementById("title").textContent = root.getAttribute("data-title") || "";
  document.getElementById("foot").textContent = root.getAttribute("data-foot") || "";
  var q = root.getAttribute("data-quote") || "";
  var qel = document.getElementById("quote");
  if (q) qel.textContent = q; else qel.style.display = "none";
  var list = document.getElementById("list");
  (root.getAttribute("data-items") || "").split("|||").filter(Boolean).slice(0, 4).forEach(function (seg) {
    var m = seg.trim().match(/^(\d+)[\s.、]*(.*)$/);
    var div = document.createElement("div");
    div.className = "item";
    div.innerHTML = '<span class="no">' + (m ? m[1] : "·") + '</span><span class="txt"></span>';
    div.querySelector(".txt").textContent = m ? m[2] : seg.trim();
    list.appendChild(div);
  });
  var n = (root.getAttribute("data-title") || "").replace(/\s/g, "").length;
  if (n > 12) document.getElementById("title").style.fontSize = "58px";
  var tl = gsap.timeline({paused: true});
  tl.from("#kicker, #title", {y: 28, autoAlpha: 0, duration: .6, ease: "power3.out"}, .1)
    .from(".item", {x: -40, autoAlpha: 0, duration: .5, stagger: .16, ease: "power3.out"}, .32)
    .from("#quote", {y: 30, autoAlpha: 0, duration: .5, ease: "back.out(1.6)"}, .78)
    .from("#foot", {autoAlpha: 0, duration: .4}, .95)
    .from("#imgcard", {autoAlpha: 0, duration: .9, ease: "power1.out"}, .15)
    .to({}, {duration: Math.max(0.2, DUR - 1.7)});
  window.__timelines = window.__timelines || {};
  window.__timelines["bs1_list_v1"] = tl;
  window.addEventListener("message", function (ev) {
    if (ev.data && ev.data.type === "preview-play") { tl.restart(); }
  });
})();
</script>
</body>
</html>
