<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- ============================================================
  hf_follow_v1 — 编辑纸墨风收尾互动卡 (2026-09-05, 版式源杂志风预览页面 07)
  内容: follow_word(栏目词, 缺省 Follow) + slogan(口号大字两行,
        末子句锈红) + 品牌印章 + 刊名底栏。全品牌层固定件 —
        口号缺省「听懂逻辑，少走弯路。」(账号口号, 执行层注入)。
  slogan 断行: 最后一个 ，/、 为界 → 前句墨色 / 后句锈红; 无界则单行。
  财经线 (tech) 专用 — 地缘线另做一套 (2026-09-05 用户裁决)。
  协议: HyperFrames — #root data-* + GSAP paused timeline 注册
        window.__timelines, 入场 ≤2s + 尾部保持段。
  ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2EEE6; --paper-2:#EAE4D8; --ink:#1C1613; --ink-soft:#3B2424;
    --taupe:#A1836E; --rust:#9E4A2F; --hair:rgba(28,22,19,.28);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
  body{font-family:"Noto Serif SC",serif;color:var(--ink)}
  #root{position:relative;width:1920px;height:1080px;background:var(--paper);overflow:hidden}
  .grain{position:absolute;inset:0;opacity:.5;pointer-events:none;
    background-image:radial-gradient(rgba(28,22,19,.06) 1px,transparent 1px);background-size:5px 5px}
  .caps{font-family:Manrope,sans-serif;font-weight:700;letter-spacing:.34em;text-transform:uppercase}

  .stage{position:absolute;inset:0;padding:110px;display:flex;flex-direction:column;
         justify-content:center;align-items:center;text-align:center}
  .stage .caps{font-size:28px}
  .stage h2{margin-top:60px;font-size:180px;font-weight:900;line-height:1.25}
  .stage h2 .rust{color:var(--rust)}
  .stamp{
    width:240px;height:240px;background:var(--rust);color:#F6F1E7;position:relative;
    display:grid;grid-template-columns:repeat(2,72px);grid-template-rows:repeat(3,74px);
    place-content:center;place-items:center;
    font-size:64px;font-weight:900;line-height:1;letter-spacing:0;
    border-radius:14px 8px 12px 9px;  /* 手工凿边的不规则圆角 */
    margin-top:64px;
  }
  .stamp::before{ /* 印框 */
    content:"";position:absolute;inset:10px;border:3px solid rgba(246,241,231,.92);
    border-radius:8px 4px 7px 5px;pointer-events:none;
  }
  .stage .caps.bot{position:absolute;bottom:90px;left:0;right:0}
</style>
</head>
<body>
<div id="root"
     data-composition-id="hf_follow_v1"
     data-start="0"
     data-duration="{{duration_sec}}"
     data-width="1920"
     data-height="1080"
     data-slogan="{{slogan}}"
     data-follow="{{follow_word}}"
     data-brand="{{brand_name}}">
  <div class="grain"></div>
  <div class="stage">
    <span class="caps" id="follow">Follow</span>
    <h2 id="slogan"></h2>
    <div class="stamp" id="stamp"></div>
    <span class="caps bot" id="brand-bot">Laotan Tech Review</span>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var root = document.getElementById("root");
  var DUR = parseFloat(root.getAttribute("data-duration")) || 5;
  var slogan = (root.getAttribute("data-slogan") || "听懂逻辑，少走弯路。").trim();
  var follow = (root.getAttribute("data-follow") || "Follow").trim();
  var brand = root.getAttribute("data-brand") || "老谭科技观";

  document.getElementById("follow").textContent = follow;

  // ── 口号两行: 最后一个 ，/、 为界; 后句锈红 (textContent 安全) ──
  var h = document.getElementById("slogan");
  var m = slogan.match(/^(.*)([，、])([^，、]*)$/);
  if (m) {
    h.appendChild(document.createTextNode(m[1] + m[2]));
    h.appendChild(document.createElement("br"));
    var span = document.createElement("span");
    span.className = "rust";
    span.textContent = m[3];
    h.appendChild(span);
  } else {
    h.textContent = slogan;
  }

  // ── 品牌印章: 五字入 2×3 印面 ──
  var stamp = document.getElementById("stamp");
  brand.replace(/\s/g, "").slice(0, 6).split("").forEach(function (ch) {
    var s = document.createElement("span");
    s.textContent = ch;
    stamp.appendChild(s);
  });

  var tl = gsap.timeline({ paused: true });
  tl.from(document.getElementById("follow"), { opacity: 0, y: 40, duration: .8,
      ease: "power3.out" }, .1)
    .from(h, { opacity: 0, y: 90, duration: 1, ease: "power3.out" }, .3)
    .from(stamp, { opacity: 0, scale: 1.5, rotate: -8, duration: .7,
      ease: "back.out(2)" }, 1.0)
    .from(document.getElementById("brand-bot"), { opacity: 0, duration: .5 }, 1.4);

  // HyperFrames 协议: paused timeline 注册到 __timelines + 尾部保持段
  window.__timelines = window.__timelines || {};
  window.__timelines["hf_follow_v1"] = tl;
  tl.to({}, { duration: Math.max(0.5, DUR - 2.0) }, 2.0);
})();
</script>
</body>
</html>
